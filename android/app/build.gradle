plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}

android {
    namespace "com.phobosbot.androidhost"
    compileSdk 34

    defaultConfig {
        applicationId "com.phobosbot.androidhost"
        // 24 is Chaquopy's own hard floor (https://chaquo.com/chaquopy/doc/current/android.html:
        // "Your project's minSdk must be at least 24"), not something chosen for this app. The
        // API-26 NotificationChannel and API-33 POST_NOTIFICATIONS calls are already guarded by
        // SDK_INT checks in PhobosService.kt/MainActivity.kt, and foregroundServiceType (API 29+)
        // is simply ignored by older Android versions - none of those needed a higher floor here.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // arm64-v8a covers most phones from the last ~8 years, armeabi-v7a covers older
            // 32-bit ones. x86_64 is only useful for testing in an emulator.
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        python {
            buildPython "python3"
            pip {
                // fastapi==0.111.0 unconditionally depends on orjson (Rust, no Android wheel,
                // no Rust-for-Android toolchain set up here) plus ujson/fastapi-cli/httpx/
                // email_validator that Phobos Bot's code doesn't use either - installed
                // separately with --no-deps, its two dependencies actually needed are in
                // requirements-android.txt instead. See that file's own comment for more.
                options "--no-deps"
                install "fastapi==0.111.0"
                options()
                install "-r", "../requirements-android.txt"
            }
        }
    }

    // Reuses the SAME Python source the Docker/Termux deployments run - no duplicated copy of
    // the bot's code living in the Android project. Chaquopy source dirs are set here, not
    // inside defaultConfig.python (that block is only for pip/buildPython).
    sourceSets {
        main {
            python {
                srcDirs = ["../../app"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
}
