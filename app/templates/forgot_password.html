<!-- Rendered by main.py's forgot_pw_page/forgot_pw_submit (GET/POST /forgot-password). Always
     shows the same generic success message whether or not the entered email matches a real
     account - deliberate, to avoid leaking which emails are registered. -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }} – Passwort vergessen</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --text: #e2e8f0; --muted: #64748b; --accent: #7c3aed; --danger: #ef4444; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; width: 100%; max-width: 380px; }
  .logo { text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; }
  h1 { text-align: center; font-size: 1.15rem; margin-bottom: 0.4rem; }
  .sub { text-align:center; font-size:0.8rem; color:var(--muted); margin-bottom:1.5rem; line-height:1.5; }
  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.65rem 0.875rem; color: var(--text); font-size: 0.875rem; outline: none; margin-bottom: 1rem; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 0.5rem; padding: 0.7rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  button:hover { opacity: 0.85; }
  .error { background: rgba(239,68,68,0.1); border: 1px solid var(--danger); color: var(--danger); border-radius: 0.5rem; padding: 0.65rem 1rem; font-size: 0.85rem; margin-bottom: 1rem; }
  .success { background: rgba(34,197,94,0.1); border: 1px solid #22c55e; color: #22c55e; border-radius: 0.5rem; padding: 0.65rem 1rem; font-size: 0.85rem; margin-bottom: 1rem; }
  .back { display:block; text-align:center; margin-top:1rem; font-size:0.8rem; color:var(--muted); text-decoration:none; }
  .back:hover { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🛡️</div>
  <h1>Passwort vergessen</h1>
  <p class="sub">Gib deine E-Mail-Adresse ein. Du erhältst einen Link zum Zurücksetzen.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if success %}<div class="success">{{ success }}</div>{% endif %}
  {% if not success %}
  <form method="post" action="/forgot-password">
    <label>E-Mail-Adresse</label>
    <input type="email" name="email_addr" required autofocus placeholder="deine@email.de">
    <button type="submit">Reset-Link senden</button>
  </form>
  {% endif %}
  <a href="/login" class="back">← Zurück zum Login</a>
</div>
</body>
</html>
