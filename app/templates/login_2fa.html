<!-- Second login step, only reached after a correct password when the account has 2FA enabled
     (main.py's login_2fa_page/login_2fa_submit, GET/POST /login/2fa). Session carries
     pending_2fa_user_id, deliberately separate from the real user_id used everywhere else -
     no dashboard access until this step also succeeds. 5 wrong codes locks the account
     15 minutes, tracked in the DB (users.totp_fail_count/totp_locked_until), not the session. -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }} – 2FA</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --text: #e2e8f0; --muted: #64748b; --accent: #7c3aed; --danger: #ef4444; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; width: 100%; max-width: 380px; }
  .logo { text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; }
  h1 { text-align: center; font-size: 1.25rem; margin-bottom: 0.5rem; }
  p.hint { text-align: center; font-size: 0.82rem; color: var(--muted); margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.65rem 0.875rem; color: var(--text); font-size: 1.1rem; text-align: center; letter-spacing: 0.2em; outline: none; margin-bottom: 1rem; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 0.5rem; padding: 0.7rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 0.25rem; }
  button:hover { opacity: 0.85; }
  .error { background: rgba(239,68,68,0.1); border: 1px solid var(--danger); color: var(--danger); border-radius: 0.5rem; padding: 0.65rem 1rem; font-size: 0.85rem; margin-bottom: 1rem; }
  .back { display:block; text-align:center; margin-top:1rem; font-size:0.8rem; color:var(--muted); text-decoration:none; }
  .back:hover { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔐</div>
  <h1>Zwei-Faktor-Code</h1>
  <p class="hint">Gib den 6-stelligen Code aus deiner Authenticator-App ein (oder einen Backup-Code).</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login/2fa">
    <label>Code</label>
    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="12">
    <button type="submit">Bestätigen</button>
  </form>
  <a href="/login" class="back">Zurück zum Login</a>
</div>
</body>
</html>
