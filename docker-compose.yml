# Diese Installation gehoert ins Home eines normalen Benutzers (z.B. /home/du/phobos-bot),
# nicht nach /root. Der Container laeuft ohnehin als Benutzer 1000 (siehe weiter unten) - aber
# die Dateien ins Konto des Administrators zu legen, macht man nicht. Schon unter /root? Den
# ganzen Ordner in ein normales Benutzer-Home verschieben und dort "docker compose up -d".
services:
  bot:
    build: ./app
    image: phobos-bot:latest
    container_name: ${BOT_CONTAINER_NAME:-Phobos-Bot}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - ./data:/app/data
      - .:/repo
    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1
    # Hier ist mit Absicht keine "user:"-Zeile noetig und keine Nummer einzustellen: der
    # Container gibt seine Rechte selbst ab und rueckt die Besitzrechte der eingehaengten
    # Ordner vorher zurecht (app/entrypoint.sh). Wessen Dateien auf dem Wirt einer anderen
    # Nummer als 1000 gehoeren, setzt oben PUID/PGID - sonst ist nichts zu tun.
    #
    # Der Bot selbst laeuft als Benutzer 1000 und hat damit gar keine Sonderrechte mehr
    # (siehe app/entrypoint.sh). Die paar Faehigkeiten hier braucht nur das Startskript,
    # in den zwei Sekunden, bevor es die Rechte abgibt: Besitzrechte der eingehaengten
    # Ordner geraderuecken (CHOWN, DAC_OVERRIDE, FOWNER) und die Rechte dann tatsaechlich
    # abgeben koennen (SETUID, SETGID). Alles andere - Netzwerk auf niedriger Ebene,
    # Einhaengen, fremde Prozesse belauschen - faellt weg.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # Nichts im Container kann sich nachtraeglich mehr Rechte holen, auch nicht ueber ein
    # Programm mit gesetztem setuid-Bit.
    security_opt:
      - no-new-privileges:true
    # ── Obergrenzen gegen Ausreisser - standardmaessig AUS ───────────────────────────────
    # Die zwei Zeilen unten sind absichtlich auskommentiert. Es ist KEINE Drosselung: der
    # Bot nimmt sich im Normalbetrieb, was er braucht (meist unter 300 MB und eine Handvoll
    # Prozesse), und merkt die Grenzen nie. Sie greifen nur, wenn etwas ausbricht - ein
    # Speicherleck, oder durch einen Fehler ploetzlich tausend Prozesse. Dann stoppt Docker
    # NUR diesen Container, statt dass er die ganze Maschine mit hinunterzieht. Dasselbe
    # Prinzip wie die Log-Grenze unten, nur fuer RAM und Prozesse.
    #
    # Auf einem gewoehnlichen Server nicht noetig. Auf einer kleinen Maschine - Raspberry
    # Pi 4/5 mit 2 bis 8 GB, oft mit mehreren Containern - lohnt es sich: die zwei Zeilen
    # einkommentieren und mem_limit an die Maschine anpassen (512m gibt dem Bot reichlich
    # Luft ueber seinem ueblichen Bedarf). Wirksam beim Neu-Erstellen ("docker compose up
    # -d"), nicht bei einem blossen Neustart.
    #mem_limit: 512m
    #pids_limit: 200
    # CPU ist anders als RAM eine ECHTE Drossel, kein Dach gegen Ausreisser: "1.0" heisst
    # hoechstens ein Kern. Auf einem Pi, wo der Bot sonst alle Kerne an sich reissen und
    # andere Dienste ausbremsen koennte, sinnvoll - aber wer ihn hier zu knapp setzt, macht
    # den Bot langsamer. Im Zweifel weglassen. Schrittanleitung in der README.
    #cpus: "1.0"
    # Ohne diesen Block schreibt Docker die Ausgabe des Bots in eine Datei, die nie
    # kleiner wird. Am 02.11.2026 war eine davon auf 21 GB angewachsen und die Platte
    # des Servers voll - der Bot lief dabei die ganze Zeit normal weiter, es fiel erst
    # auf, als nichts mehr gespeichert werden konnte.
    #
    # 20 MB mal 5 Dateien sind hoechstens 100 MB je Container. Das deckt bei normalem
    # Aufkommen gut eine Woche ab; wer es nach ZEIT begrenzen will, nimmt zusaetzlich
    # tools/logrotate-phobos.conf - Docker selbst kennt nur Groesse und Anzahl.
    #
    # Greift erst, wenn der Container NEU ERSTELLT wird ("docker compose up -d").
    # Ein Neustart aendert nichts: Docker uebernimmt diese Einstellung beim Anlegen.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

