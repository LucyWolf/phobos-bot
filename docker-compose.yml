services:
  bot:
    build: ./app
    container_name: discord-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1
    mem_limit: ${MEM_LIMIT:-1g}
    memswap_limit: ${MEM_LIMIT:-1g}

