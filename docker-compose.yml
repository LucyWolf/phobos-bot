services:
  phobos:
    build: ./app
    restart: unless-stopped
    container_name: phobos-bot-phobos
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: ${MEM_LIMIT:-1g}
    memswap_limit: ${MEM_LIMIT:-1g}
