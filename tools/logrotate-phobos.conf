# Docker-Protokolle nach ZEIT begrenzen - sieben Tage.
#
# Docker selbst kann das nicht: der json-file-Treiber kennt nur max-size und max-file
# (siehe docker-compose.yml). Beides zusammen ergibt die Begrenzung, die gemeint war -
# der Deckel in compose verhindert, dass eine einzelne Datei zwischen zwei Laeufen von
# logrotate aus dem Ruder laeuft, und diese Datei hier wirft weg, was aelter als eine
# Woche ist.
#
# Einrichten (auf dem Server, als root):
#   cp tools/logrotate-phobos.conf /etc/logrotate.d/docker-phobos
#   logrotate -d /etc/logrotate.d/docker-phobos     # Probelauf, aendert nichts
#
# Es laeuft danach taeglich ueber den logrotate-Timer des Systems mit.

/var/lib/docker/containers/*/*-json.log {
    # Taeglich nachsehen, alles aelter als sieben Tage wegwerfen.
    daily
    rotate 7
    maxage 7

    # Entscheidend fuer einen Server, der weiterlaufen soll: copytruncate kopiert die
    # Datei und setzt die ORIGINALE auf null, statt sie umzubenennen. Docker schreibt
    # ueber einen offenen Dateizeiger - wird die Datei unter ihm weggezogen, schreibt es
    # weiter in etwas, das es nicht mehr gibt, und das Protokoll bleibt leer, bis der
    # Container neu gestartet wird. Mit copytruncate muss nichts neu gestartet werden.
    copytruncate

    # Auch bei Groesse eingreifen, nicht erst nach einem Tag: eine Schleife, die
    # Amok laeuft, schafft 21 GB in drei Wochen - und deutlich mehr an einem Tag.
    maxsize 100M

    # Kein Fehler, wenn gerade kein Container laeuft oder eine Datei schon leer ist.
    missingok
    notifempty

    # Platz sofort zurueckgeben.
    compress
    delaycompress

    # Keine leeren Dateien zurueeklassen, auf die niemand mehr schreibt.
    nocreate
}
